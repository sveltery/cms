name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sh scripts/bootstrap.sh
  browser:
    # Run sandboxed Chromium on this image without changing host security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run complete bulk taxonomy Source callbacks in sandboxed Chromium
        run: pnpm test:bulk-taxonomy-source
        env:
          DEBUG: pw:browser
      - name: Run sandboxed datetime widget source assertions
        run: timeout --kill-after=30s 180s pnpm test:date-time:browser
        env:
          DEBUG: pw:browser
      - name: Run complete menu Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:menu-browser-source
        env:
          DEBUG: pw:browser
      - run: pnpm build
      - name: Run sandboxed browser tests
        run: timeout --kill-after=30s 180s pnpm test:browser
        env:
          DEBUG: pw:browser,pw:webserver
      - run: pnpm build:node
      - name: Run sandboxed Node browser tests
        run: timeout --kill-after=30s 180s pnpm test:browser
        env:
          SVELTERY_BROWSER_TARGET: node
          DEBUG: pw:browser,pw:webserver
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
