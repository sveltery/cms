name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sh scripts/bootstrap.sh
  browser:
    # Run sandboxed Chromium on this image without changing host security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run complete bulk taxonomy Source callbacks in sandboxed Chromium
        run: pnpm test:bulk-taxonomy-source
        env:
          DEBUG: pw:browser
      - name: Run sandboxed datetime widget source assertions
        run: timeout --kill-after=30s 180s pnpm test:date-time:browser
        env:
          DEBUG: pw:browser
      - name: Run complete menu Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:menu-browser-source
        env:
          DEBUG: pw:browser
      - name: Run complete redirect admin Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:redirect-integration-source-browser
        env:
          DEBUG: pw:browser
      - name: Run complete pinned Sections and Widgets Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:sections-widgets-browser
        env:
          DEBUG: pw:browser
      - name: Run complete comments Source inbox assertions in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:comments-browser
        env:
          DEBUG: pw:browser
      - name: Run complete content picker Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:content-picker-browser-source
        env:
          DEBUG: pw:browser
      - name: Run complete pinned schema administration UI Source callbacks in sandboxed Chromium
        run: timeout --kill-after=30s 180s pnpm test:schema-admin-ui-browser
        env:
          DEBUG: pw:browser
      - run: pnpm build
      - name: Run sandboxed browser tests
        run: timeout --kill-after=30s 180s pnpm test:browser
        env:
          DEBUG: pw:browser,pw:webserver
      - run: pnpm build:node
      - name: Run sandboxed Node browser tests
        run: timeout --kill-after=30s 180s pnpm test:browser
        env:
          SVELTERY_BROWSER_TARGET: node
          DEBUG: pw:browser,pw:webserver
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  rich-editor-source:
    # Terminal whole Source authoring assertions retain the official browser host.
    needs: browser
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify all whole rich editor Source families and immutable files
        run: node scripts/check-rich-editor-source.mjs
      - name: Run all whole rich editor, slash and footer Source assertions in sandboxed Chromium
        run: timeout --kill-after=30s 600s node node_modules/vitest/vitest.mjs run --config vitest.rich-editor-browser.config.ts --reporter=default --reporter=json --outputFile=rich-editor-browser-report.json
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-editor-source-browser-evidence
          path: rich-editor-browser-report.json
          retention-days: 7
  rich-html-source:
    needs: browser
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify all immutable rich editor Source authorities
        run: node scripts/check-rich-editor-source.mjs
      - name: Run complete original HTML editor and preview Source callbacks
        run: timeout --kill-after=30s 600s node node_modules/vitest/vitest.mjs run --config vitest.rich-html-browser.config.ts --reporter=default --reporter=json --outputFile=rich-html-browser-report.json
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-html-source-browser-evidence
          path: rich-html-browser-report.json
          retention-days: 7
